<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Live Locations (Leaflet + API)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px;
        border-radius: 6px;
        font-size: 14px;
      }
      #map {
        height: 100%;
        width: 100%;
      }
      #controls input[type="text"] {
        width: 220px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>API Base:</label>
      <input id="apiBase" type="text" value="https://location-api-cc1x.onrender.com" />
      <button id="btnLatest">Load Latest</button>
      <button id="btnAll">Load All</button>
      <button id="btnTogglePoll">Start Auto-Refresh</button>
    </div>

    <div id="map"></div>

    <script>
      const map = L.map("map").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      let latestMarker = null;
      let pathLine = L.polyline([], { weight: 3 }).addTo(map);
      let lastId = null; // track last seen id
      let firstFit = false; // only auto-zoom the first time

      function updateTrack(newLocs) {
        if (!newLocs.length) return;

        const last = newLocs[newLocs.length - 1];
        if (lastId === last.id) {
          // no change → skip update
          return;
        }
        lastId = last.id;

        // update path with all points
        const pts = newLocs.map(p => [p.latitude, p.longitude]);
        pathLine.setLatLngs(pts);

        // update marker
        if (latestMarker) {
          latestMarker.setLatLng([last.latitude, last.longitude]);
        } else {
          latestMarker = L.marker([last.latitude, last.longitude]).addTo(map);
        }
        latestMarker.bindPopup(
          `Lat: ${last.latitude.toFixed(6)}<br>Lng: ${last.longitude.toFixed(6)}`
        );

        // only fit bounds once (initial load), then keep map position
        if (!firstFit) {
          map.fitBounds(pathLine.getBounds(), { padding: [30, 30] });
          firstFit = true;
        }
      }

      async function fetchAll(base) {
        const res = await fetch(`${base}/locations`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      document.getElementById("btnLatest").onclick = async () => {
        const base = document.getElementById("apiBase").value.trim();
        try {
          const arr = await fetchAll(base);
          updateTrack(arr);
        } catch (e) {
          alert("Failed: " + e.message);
        }
      };

      document.getElementById("btnAll").onclick = async () => {
        const base = document.getElementById("apiBase").value.trim();
        try {
          const arr = await fetchAll(base);
          updateTrack(arr);
        } catch (e) {
          alert("Failed: " + e.message);
        }
      };

      let pollTimer = null;
      const btnToggle = document.getElementById("btnTogglePoll");
      btnToggle.onclick = () => {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
          btnToggle.textContent = "Start Auto-Refresh";
          return;
        }
        const base = document.getElementById("apiBase").value.trim();
        const poll = async () => {
          try {
            const arr = await fetchAll(base);
            updateTrack(arr);
          } catch {}
        };
        poll(); // run immediately
        pollTimer = setInterval(poll, 5000);
        btnToggle.textContent = "Stop Auto-Refresh";
      };
    </script>
  </body>
</html>
